# kiln theme kiln for starship (agent-kit/design/kiln.py). Copy to ~/.config/starship.toml,
# or keep yours and take only [palettes.kiln] and `palette`.
palette = "kiln"
format = "$directory$git_branch$git_status$python$nodejs$env_var$cmd_duration$line_break$character"

[directory]
style = "bold ink"
truncation_length = 3

[git_branch]
format = "[· $branch]($style) "
style = "muted"

[git_status]
format = "[$all_status$ahead_behind]($style) "
style = "warn"

[python]
format = "[· py $version]($style) "
style = "faint"

[nodejs]
format = "[· node $version]($style) "
style = "faint"

[env_var.AP_PROFILE]
format = "[● $env_value]($style) "
style = "bold accent"

[cmd_duration]
format = "[· $duration]($style) "
style = "faint"

[character]
success_symbol = "[›](bold accent)"
error_symbol = "[›](bold err)"

[palettes.kiln]
bg = "#0c0b0a"
surface = "#151311"
raised = "#1e1b18"
line = "#2c2824"
ink = "#ede7db"
soft = "#cbc4b6"
muted = "#988f81"
faint = "#675f55"
cyan = "#8bd8ea"
violet = "#a99cf8"
pink = "#eaa6d2"
amber = "#f0cd8a"
green = "#a3d69a"
red = "#ef8f86"
blue = "#8fb4f2"
selection = "#2e2937"
accent = "#a99cf8"
info = "#8bd8ea"
ok = "#a3d69a"
warn = "#f0cd8a"
err = "#ef8f86"
link = "#8fb4f2"
cursor = "#a99cf8"
