# kiln for starship, generated by agent-kit/design/build.py. Copy to ~/.config/starship.toml
# or keep your own and only take [palettes.kiln] and `palette`.
palette = "kiln"
add_newline = true
format = "$directory$git_branch$git_status$python$nodejs$env_var$cmd_duration$line_break$character"

[directory]
style = "bold ink"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[· $branch]($style) "
style = "muted"

[git_status]
format = "[$all_status$ahead_behind]($style) "
style = "amber"

[python]
format = "[· py $version]($style) "
style = "faint"

[nodejs]
format = "[· node $version]($style) "
style = "faint"

# agent-stack profile, e.g. "● work-eco" (AP_PROFILE comes from `ap use`).
[env_var.AP_PROFILE]
format = "[● $env_value]($style) "
style = "bold violet"

[cmd_duration]
format = "[· $duration]($style) "
style = "faint"

[character]
success_symbol = "[›](bold violet)"
error_symbol = "[›](bold red)"

[palettes.kiln]
bg = "#0c0b0a"
surface = "#151311"
raised = "#1e1b18"
line = "#2c2824"
ink = "#ede7db"
soft = "#cbc4b6"
muted = "#988f81"
faint = "#675f55"
cyan = "#8bd8ea"
violet = "#b29dfb"
pink = "#f2a5d2"
amber = "#f0cd8a"
green = "#a3d69a"
red = "#ef8f86"
blue = "#8fb4f2"
selection = "#2e2937"
accent = "#b29dfb"
info = "#8bd8ea"
ok = "#a3d69a"
warn = "#f0cd8a"
err = "#ef8f86"
link = "#8fb4f2"
cursor = "#b29dfb"
