# kiln theme catppuccin for starship (agent-kit/design/kiln.py). Copy to ~/.config/starship.toml,
# or keep yours and take only [palettes.kiln] and `palette`.
palette = "kiln"
format = "$directory$git_branch$git_status$python$nodejs$env_var$cmd_duration$line_break$character"

[directory]
style = "bold ink"
truncation_length = 3

[git_branch]
format = "[· $branch]($style) "
style = "muted"

[git_status]
format = "[$all_status$ahead_behind]($style) "
style = "warn"

[python]
format = "[· py $version]($style) "
style = "faint"

[nodejs]
format = "[· node $version]($style) "
style = "faint"

[env_var.AP_PROFILE]
format = "[● $env_value]($style) "
style = "bold accent"

[cmd_duration]
format = "[· $duration]($style) "
style = "faint"

[character]
success_symbol = "[›](bold accent)"
error_symbol = "[›](bold err)"

[palettes.kiln]
bg = "#1e1e2e"
surface = "#181825"
raised = "#313244"
line = "#45475a"
ink = "#cdd6f4"
soft = "#bac2de"
muted = "#9399b2"
faint = "#6c7086"
cyan = "#89dceb"
violet = "#cba6f7"
pink = "#f5c2e7"
amber = "#f9e2af"
green = "#a6e3a1"
red = "#f38ba8"
blue = "#89b4fa"
selection = "#3a3b51"
accent = "#cba6f7"
info = "#89dceb"
ok = "#a6e3a1"
warn = "#f9e2af"
err = "#f38ba8"
link = "#89b4fa"
cursor = "#cba6f7"
