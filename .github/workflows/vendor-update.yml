# Weekly: move the third-party skills to upstream's latest commit and merge it without a person,
# once two gates pass: a pattern scan (scripts/vendor.py --scan) and a Claude review of the diff
# (.github/prompts/vendor-review.md). If either gate fails, the PR stays open with the label "hold"
# and the reasons in its description; that open PR is the only time the owner hears about it.
#
# Needs: secret CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`, uses the Pro/Max subscription) or
# ANTHROPIC_API_KEY, and repo setting Actions > General > "Allow GitHub Actions to create and approve
# pull requests". Optional repository variable REVIEW_MODEL (default claude-sonnet-5-5).
name: vendor-update
on:
  schedule: [{ cron: "17 6 * * 1" }]   # Mondays 06:17 UTC
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }   # keep GITHUB_TOKEN out of .git/config, where the reviewer reads
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Move pins to upstream HEAD
        id: bump
        run: |
          python3 scripts/vendor.py --latest | tee "$RUNNER_TEMP/bump.txt"
          python3 scripts/vendor.py --direct-diff   # upstream diff of moved [[direct]] pins
          echo "changed=$([ -n "$(git status --porcelain)" ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
      - name: Gate 1, pattern scan
        id: scan
        if: steps.bump.outputs.changed == '1'
        run: |
          if python3 scripts/vendor.py --scan > "$RUNNER_TEMP/scan.txt"; then echo "ok=1" >> "$GITHUB_OUTPUT"
          else echo "ok=0" >> "$GITHUB_OUTPUT"; fi
          cat "$RUNNER_TEMP/scan.txt"
      - uses: actions/setup-node@v4
        if: steps.bump.outputs.changed == '1'
        with: { node-version: 22 }
      - name: Gate 2, Claude review
        id: review
        if: steps.bump.outputs.changed == '1'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: ${{ vars.REVIEW_MODEL || 'claude-sonnet-5-5' }}
        run: |
          npm install -g @anthropic-ai/claude-code
          claude -p "$(cat .github/prompts/vendor-review.md)" --model "$MODEL" --max-turns 60 \
            --permission-mode acceptEdits \
            --allowedTools "Read,Glob,Grep,Write(review.json),Bash(git diff:*),Bash(git status:*)" || true
          # pass only with evidence for every changed file (and for .direct.diff when it has content)
          verdict="$(python3 - <<'PY' 2>/dev/null || echo hold
          import json, os, subprocess
          r = json.load(open("review.json"))
          out = subprocess.run(["git", "status", "--porcelain", "-uall", "--", "skills", "vendor.toml"],
                               capture_output=True, text=True, check=True).stdout
          changed = {line[3:].strip() for line in out.splitlines()}
          if os.path.exists(".direct.diff") and open(".direct.diff").read().strip():
              changed.add(".direct.diff")
          ok = r.get("verdict") == "pass" and changed <= set(r.get("evidence", {}))
          print("pass" if ok else "hold")
          PY
          )"
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          mv review.json "$RUNNER_TEMP/review.json" 2>/dev/null || echo '{"summary":"no review written","concerns":["review step failed"]}' > "$RUNNER_TEMP/review.json"
      - name: Check skills/ matches vendor.toml
        if: steps.bump.outputs.changed == '1'
        run: python3 scripts/vendor.py --check
      - name: Write PR body
        if: steps.bump.outputs.changed == '1'
        run: |
          python3 - "$RUNNER_TEMP" <<'PY' > "$RUNNER_TEMP/body.md"
          import json, sys, pathlib
          t = pathlib.Path(sys.argv[1]); r = json.loads((t / "review.json").read_text())
          print("Weekly update of third-party skills (by: vendor-update).\n")
          print(r.get("summary", "") + "\n")
          print("Pins moved:\n```\n" + (t / "bump.txt").read_text() + "```")
          scan = (t / "scan.txt").read_text().strip()
          if scan or r.get("concerns"):
              print("\n**Held for a person.** Reasons:")
              for line in scan.splitlines() + r.get("concerns", []):
                  print(f"- {line}")
          PY
      - name: Open PR
        id: pr
        if: steps.bump.outputs.changed == '1'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: vendor-update
          delete-branch: true
          commit-message: "vendor: update third-party skills to upstream HEAD"
          title: "vendor: update third-party skills"
          body-path: ${{ runner.temp }}/body.md
          labels: ${{ (steps.scan.outputs.ok == '1' && steps.review.outputs.verdict == 'pass') && 'vendor' || 'vendor,hold' }}
      # Both gates passed: merge now. PRs opened with GITHUB_TOKEN start no other workflows, and the
      # checks CI would run (--check) ran above.
      - name: Merge PR
        if: steps.pr.outputs.pull-request-number != '' && steps.scan.outputs.ok == '1' && steps.review.outputs.verdict == 'pass'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "${{ steps.pr.outputs.pull-request-number }}" --squash --delete-branch --repo "$GITHUB_REPOSITORY"
